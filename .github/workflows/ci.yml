name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          fmt=$(gofmt -l $(find . -name '*.go' -not -path './proto/cloudattrpb/*'))
          if [ -n "$fmt" ]; then echo "gofmt needed on:"; echo "$fmt"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: test (race)
        run: go test -race ./...

      - name: build
        run: go build ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      # Scan dependencies and reachable code for known CVEs. The service fetches
      # over the network and exposes HTTP/gRPC, so a vulnerable grpc/x/net should
      # fail CI before it ships.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build -t cloudip:ci .
