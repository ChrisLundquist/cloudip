# Cloud-Attribution via the stock ngx_http_geoip2_module — no custom module.
# Point it at the same cloud.mmdb the gRPC/HTTP servers read. Record keys become
# nginx variables. Requires nginx built with --add-module=ngx_http_geoip2_module.

# --- http {} context -------------------------------------------------------

geoip2 /etc/nginx/cloud.mmdb {
    auto_reload 60m;                  # re-mmap when the file is atomically replaced
    $cloud_provider provider;
    $cloud_region   region;
    $cloud_service  services 0;       # first element of the services array
    $cloud_ipv6     ipv6;
    $cloud_nbg      ext network_border_group;   # nested string leaf
}

# Is the client in any known cloud range?
map $cloud_provider $is_cloud {
    default 0;
    ~.      1;
}

log_format cloud '$remote_addr cloud=$cloud_provider/$cloud_region '
                 'svc=$cloud_service is_cloud=$is_cloud "$request"';

