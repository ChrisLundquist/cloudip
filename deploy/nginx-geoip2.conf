# Cloud-Attribution via the stock ngx_http_geoip2_module — no custom module.
# Point it at the same cloud.mmdb the gRPC/HTTP servers read. Record keys become
# nginx variables. Requires nginx built with --add-module=ngx_http_geoip2_module.

# --- http {} context -------------------------------------------------------

geoip2 /etc/nginx/cloud.mmdb {
    auto_reload 60m;                  # re-mmap when the file is atomically replaced
    $cloud_provider provider;
    $cloud_region   region;
    $cloud_service  services 0;       # first element of the services array
    $cloud_ipv6     ipv6;
    $cloud_nbg      ext network_border_group;   # nested string leaf
    # For a combined build (cloudattr build --with-reputation) the categories
    # live in this same file; the variable is simply unset on pure-cloud records.
    #$cloud_category categories 0;    # first reputation tag, e.g. tor_exit
    # For an ASN-enriched build (cloudattr build --with-asn) the origin AS is a
    # stored ext leaf, so nginx CAN read it (unset on unannounced ranges).
    #$cloud_asn    ext asn;           # e.g. 16509, or 14618 for legacy AMAZON-AES space
    #$cloud_as_org ext as_org;        # e.g. AMAZON-02
}

# Optional: a standalone IP->ASN database (cloudattr build --asn) attributes
# EVERY routed IP, cloud or not.
#geoip2 /etc/nginx/asn.mmdb {
#    auto_reload 60m;
#    $asn    ext asn;
#    $as_org ext as_org;
#}

# Optional: the module accepts multiple geoip2 blocks, one per database — so a
# separate reputation.mmdb (cloudattr build --reputation) can sit alongside the
# cloud DB. Uncomment the block AND the $is_flagged map together: nginx refuses
# to start if either references a file or variable that doesn't exist.
#geoip2 /etc/nginx/reputation.mmdb {
#    auto_reload 60m;
#    $rep_provider provider;           # tor / spamhaus / abuse.ch
#    $rep_category categories 0;       # first tag: tor_exit, drop, botnet_c2, ...
#}

# Is the client in any known cloud range?
map $cloud_provider $is_cloud {
    default 0;
    ~.      1;
}

# Does the client carry any reputation tag? (requires the reputation block above)
#map $rep_category $is_flagged {
#    default 0;
#    ~.      1;
#}

log_format cloud '$remote_addr cloud=$cloud_provider/$cloud_region '
                 'svc=$cloud_service is_cloud=$is_cloud "$request"';

